name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token by default. The publish job asks for more, only for itself.
permissions:
  contents: read

# A new push cancels the older run for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.dir }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: backend
            pnpm: 12.21.0
            check: pnpm typecheck
          - dir: mcp-server
            pnpm: 12.18.0
            check: pnpm typecheck
          - dir: frontend
            pnpm: 12.18.0
            check: pnpm lint
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ matrix.pnpm }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ${{ matrix.dir }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Type errors (backend, mcp-server) or lint errors (frontend) fail the build here
      - run: ${{ matrix.check }}
      - run: pnpm build

  # Pull requests: prove the images still build, publish nothing
  docker:
    name: docker images
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build

  # Main: build the three images and push them to GitHub Container Registry.
  # The server only pulls these images, it never builds.
  publish:
    name: publish images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      # The public Google client id is baked into the UI at build time.
      # Set it as a repository variable (not a secret): Settings > Variables.
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          PREFIX="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/beacon"
          docker build -t "$PREFIX-backend:latest" -t "$PREFIX-backend:${GITHUB_SHA}" backend
          docker build -t "$PREFIX-mcp:latest" -t "$PREFIX-mcp:${GITHUB_SHA}" mcp-server
          docker build --build-arg VITE_GOOGLE_CLIENT_ID="$VITE_GOOGLE_CLIENT_ID" \
            -t "$PREFIX-web:latest" -t "$PREFIX-web:${GITHUB_SHA}" frontend
          for name in backend mcp web; do
            docker push "$PREFIX-$name:latest"
            docker push "$PREFIX-$name:${GITHUB_SHA}"
          done
