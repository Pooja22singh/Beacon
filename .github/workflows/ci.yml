name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only needs to check out the code
permissions:
  contents: read

# A new push cancels the older run for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.dir }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: backend
            pnpm: 12.21.0
            check: pnpm typecheck
          - dir: mcp-server
            pnpm: 12.18.0
            check: pnpm typecheck
          - dir: frontend
            pnpm: 12.18.0
            check: pnpm lint
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ matrix.pnpm }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: ${{ matrix.dir }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Type errors (backend, mcp-server) or lint errors (frontend) fail the build here
      - run: ${{ matrix.check }}
      - run: pnpm build

  docker:
    name: docker images
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Builds all four images exactly as the compose file defines them
      - run: docker compose build
