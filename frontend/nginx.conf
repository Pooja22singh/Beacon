# Two backend copies. Nginx sends each new request to the next one (round robin)
# and skips a copy that stops answering.
upstream beacon_api {
    server backend-1:3000 max_fails=2 fail_timeout=10s;
    server backend-2:3000 max_fails=2 fail_timeout=10s;
}

# Behind a platform TLS terminator the browser protocol arrives in X-Forwarded-Proto.
# Pass it through so the backend can issue secure cookies. Fall back to our own scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reject oversized bodies early. The API accepts at most 50 messages of 2000 chars.
    client_max_body_size 256k;

    # Vite file names include a content hash, so they can be cached for a year
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # API: forwarded to the backend copies
    location ~ ^/(chat|auth)(/|$) {
        proxy_pass http://beacon_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # The backend gives up after 30 s, so Nginx waits slightly longer
        proxy_read_timeout 35s;
    }

    # Liveness for load balancers and uptime checks
    location = /health {
        proxy_pass http://beacon_api;
        access_log off;
    }

    # Single page app: unknown paths return index.html
    location / {
        try_files $uri /index.html;
    }
}
